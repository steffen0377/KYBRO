{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>{{ titel }}</h4>
  {% if url_neu and darf_schreiben %}
    <a href="{% url url_neu %}" class="btn btn-app-primary"><i class="bi bi-plus"></i> Neu</a>
  {% endif %}
</div>
<form method="get" class="row g-2 mb-3">
  <div class="col-auto">
    <div class="position-relative" style="min-width:300px;">
      <input type="text" name="q" class="form-control" style="padding-right:2rem;" placeholder="Suche nach Nummer oder Kunde" value="{{ suche }}" autocomplete="off" data-livesuche="#ergebnis">
      <button type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-2" data-livesuche-leeren aria-label="Suche leeren"></button>
    </div>
  </div>
  <div class="col-auto">
    <select name="status" class="form-select" onchange="this.form.submit()">
      <option value="">Alle Status</option>
      {% for wert, label in status_auswahl %}<option value="{{ wert }}" {% if wert == status_filter %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
</form>
<div id="ergebnis">{% include "belege/_beleg_tabelle.html" %}</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'core/js/livesuche.js' %}"></script>{% endblock %}
