{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Gruppen und Rechte</h4>
  <a href="{% url 'accounts:gruppe_neu' %}" class="btn btn-app-primary">+ Neue Gruppe</a>
</div>
<div class="card p-3">
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead>
        <tr><th>Name</th><th>Benutzer</th><th>Rechte</th><th></th></tr>
      </thead>
      <tbody>
      {% for g in gruppen %}
        <tr style="cursor:pointer;" data-href="{% url 'accounts:gruppe_bearbeiten' g.pk %}">
          <td><a href="{% url 'accounts:gruppe_bearbeiten' g.pk %}" class="text-reset text-decoration-none">{{ g.name }}</a></td>
          <td>{{ g.anzahl_benutzer }}</td>
          <td>{{ g.rechte_text|default:"–" }}</td>
          <td class="text-end">
            <form method="post" action="{% url 'accounts:gruppe_loeschen' g.pk %}" class="d-inline" onsubmit="return confirm('Gruppe wirklich löschen?')">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-app-outline-danger">Löschen</button>
            </form>
          </td>
        </tr>
      {% empty %}
        <tr><td colspan="4" class="text-muted">Es sind noch keine Gruppen angelegt.</td></tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
