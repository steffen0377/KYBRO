{% extends "base.html" %}
{% load static rechte %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4>Lieferanten</h4>
  {% if user|darf:"lieferanten:schreiben" %}<a href="{% url 'stammdaten:lieferanten_neu' %}" class="btn btn-app-primary"><i class="bi bi-plus"></i> Neuer Lieferant</a>{% endif %}
</div>
<div class="mb-3">
  <div class="position-relative" style="max-width:300px;">
    <input type="text" class="form-control" style="padding-right:2rem;" placeholder="Suche" value="{{ suche }}" autocomplete="off" data-livesuche="#ergebnis">
    <button type="button" class="btn-close position-absolute top-50 end-0 translate-middle-y me-2" data-livesuche-leeren aria-label="Suche leeren"></button>
  </div>
</div>
<div id="ergebnis">{% include "stammdaten/_lieferanten_tabelle.html" %}</div>
{% endblock %}

{% block extra_js %}<script src="{% static 'core/js/livesuche.js' %}"></script>{% endblock %}
