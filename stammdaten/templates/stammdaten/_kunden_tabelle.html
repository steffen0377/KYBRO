{% load rechte %}
<div class="card p-3">
  <div class="table-responsive">
  <table class="table table-hover align-middle">
    <thead><tr><th>Nr.</th><th>Name/Firma</th><th>Ort</th><th>E-Mail</th><th></th></tr></thead>
    <tbody>
    {% for k in kunden %}
      <tr style="cursor:pointer;" data-href="{% url 'stammdaten:kunden_bearbeiten' k.pk %}">
        <td>{{ k.kundennummer }}</td>
        <td>{{ k.anzeigename }}</td>
        <td>{{ k.plz }} {{ k.ort }}</td>
        <td>{{ k.email }}</td>
        <td class="text-end">
          {% if user|darf:"kunden:schreiben" %}
          <form method="post" action="{% url 'stammdaten:kunden_loeschen' k.pk %}" class="d-inline" onsubmit="return confirm('Kunde wirklich löschen?')">
            {% csrf_token %}<button class="btn btn-sm btn-app-outline-danger" type="submit">Löschen</button>
          </form>
          {% endif %}
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="5" class="text-muted text-center py-3">Keine Kunden gefunden.</td></tr>
    {% endfor %}
    </tbody>
  </table>
  </div>
</div>
<script>
  document.querySelectorAll('#ergebnis tr[data-href]').forEach(function (zeile) {
    zeile.addEventListener('click', function (e) { if (!e.target.closest('a,button,form,input')) { window.location = zeile.dataset.href; } });
  });
</script>
