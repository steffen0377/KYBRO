<form method="post" class="overlay-formular" data-schnell-form>
  {% csrf_token %}
  <h5 class="mb-3">{{ titel }}</h5>
  {% for fehler in form.non_field_errors %}<div class="alert alert-app-danger py-2">{{ fehler }}</div>{% endfor %}
  <div class="row g-2">
    {% for feld in form %}
      <div class="{% if feld.name in 'strasse,firma,name,uebergeordnet,befreiungsgrund' %}col-12{% else %}col-6{% endif %}">
        {% if feld.field.widget.input_type == "checkbox" %}
          <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="{{ feld.id_for_label }}" name="{{ feld.html_name }}" {% if feld.value %}checked{% endif %}>
            <label class="form-check-label" for="{{ feld.id_for_label }}">{{ feld.label }}</label>
          </div>
        {% else %}
          {% include "core/feld.html" with feld=feld %}
        {% endif %}
      </div>
    {% endfor %}
  </div>
  <div class="d-flex justify-content-end gap-2 mt-2">
    <button type="button" class="btn btn-app-secondary" data-schnell-abbrechen>Abbrechen</button>
    <button type="submit" class="btn btn-app-primary">Speichern</button>
  </div>
</form>
