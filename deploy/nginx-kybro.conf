# /etc/nginx/sites-available/kybro  (Standard-Reverse-Proxy)
# Aktivieren:
#   sudo cp deploy/nginx-kybro.conf /etc/nginx/sites-available/kybro
#   sudo ln -s /etc/nginx/sites-available/kybro /etc/nginx/sites-enabled/kybro
#   sudo nginx -t && sudo systemctl reload nginx
# Zertifikat vorher holen, siehe docs/Betrieb.md (certbot certonly --standalone ...)
# In der .env: TRUST_PROXY_SSL_HEADER=True und CSRF_TRUSTED_ORIGINS=https://kybro.example.de

server {
    listen 80;
    listen [::]:80;
    server_name kybro.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kybro.example.de;

    ssl_certificate     /etc/letsencrypt/live/kybro.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kybro.example.de/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Briefbogen (PDF) und Unterschriften werden hochgeladen.
    client_max_body_size 20m;

    # Statische Dateien (CSS/JS) direkt ausliefern. /media wird bewusst NICHT veröffentlicht:
    # Briefbogen und Unterschriften werden nur über die Anwendung nach Anmeldung ausgeliefert.
    location /static/ {
        alias /opt/kybro/staticfiles/;
        # Browser fragt bei jedem Aufruf nach (ETag), damit Updates sofort wirken statt erst nach Cache-Ablauf.
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;   # passend zu --timeout in kybro.service (PDF-Erzeugung)
    }
}
