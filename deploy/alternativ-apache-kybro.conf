# Alternative zu nginx (Standard: nginx-kybro.conf)
# /etc/apache2/sites-available/kybro.conf
# Aktivieren: sudo a2enmod proxy proxy_http headers ssl rewrite && sudo a2ensite kybro && sudo systemctl reload apache2
# In der .env: TRUST_PROXY_SSL_HEADER=True und CSRF_TRUSTED_ORIGINS=https://kybro.example.de
<VirtualHost *:80>
    ServerName kybro.example.de
    RewriteEngine On
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName kybro.example.de
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/kybro.example.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/kybro.example.de/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"

    # Statische Dateien (CSS/JS) direkt ausliefern. /media wird bewusst NICHT veröffentlicht:
    # Briefbogen und Unterschriften werden nur über die Anwendung nach Anmeldung ausgeliefert.
    Alias /static/ /srv/kybro/staticfiles/
    <Directory /srv/kybro/staticfiles>
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"
</VirtualHost>
